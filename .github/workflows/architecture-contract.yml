name: Architecture contract

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce Core / Product / Growth ownership
        run: python3 core/tools/check_architecture.py
      - name: Validate Core CI impact routing
        run: python3 core/tools/check_ci_coverage.py
      - name: Test Core CI policy parser
        run: python3 -m unittest discover -s core/tools -p 'test_ci_coverage.py'
