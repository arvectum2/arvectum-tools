name: PUSHKIN iOS CI

on:
  push:
    branches:
      - '**'
    paths:
      - 'pushkin/ios/**'
      - 'core/packages/**'
      - '.github/workflows/pushkin-ios-ci.yml'
  pull_request:
    paths:
      - 'pushkin/ios/**'
      - 'core/packages/**'
      - '.github/workflows/pushkin-ios-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pushkin-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-for-testing:
    runs-on: xcode-27
    defaults:
      run:
        working-directory: pushkin/ios

    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: A6 app build and local-only onboarding regression
        timeout-minutes: 25
        run: |
          xcodebuild \
            -project ArvectumNotifyIOS.xcodeproj \
            -scheme ArvectumNotify \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0' \
            -parallel-testing-enabled NO \
            -jobs 2 \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -only-testing:ArvectumNotifyTests \
            -only-testing:ArvectumNotifyUITests/PushkinA6OnboardingUITests \
            test

  delete-regression:
    runs-on: xcode-27
    timeout-minutes: 25
    defaults:
      run:
        working-directory: pushkin/ios
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Exercise deletion in isolated iOS simulator
        run: |
          xcodebuild \
            -project ArvectumNotifyIOS.xcodeproj \
            -scheme ArvectumNotify \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0' \
            -parallel-testing-enabled NO \
            -jobs 2 \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -only-testing:ArvectumNotifyTests/NotificationHistoryDeletionTests \
            -only-testing:ArvectumNotifyUITests/NotificationDeletionUITests \
            test
