name: Core modules and consumers
on:
  push:
    branches: ['**']
    paths: ['core/packages/**', 'core/Package.swift', 'core/tests/**', 'core/dependencies/catalog.json', 'core/dependencies/android.versions.toml', 'core/tools/sync_dependencies.py', 'core/tools/check_swift_lockfiles.py', '.github/workflows/core-ci.yml']
  pull_request:
    paths: ['core/packages/**', 'core/Package.swift', 'core/tests/**', 'core/dependencies/catalog.json', 'core/dependencies/android.versions.toml', 'core/tools/sync_dependencies.py', 'core/tools/check_swift_lockfiles.py', '.github/workflows/core-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: xcode-27
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Run Core Swift tests
        working-directory: core
        run: swift test
  consumers:
    needs: core-tests
    runs-on: xcode-27
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {app: chickmark, project: HabitsByArvectumIOS, scheme: HabitsByArvectum}
          - {app: pushkin, project: ArvectumNotifyIOS, scheme: ArvectumNotify}
          - {app: photo-pdf-to-size, project: PhotoPodRazmerIOS, scheme: PhotoPodRazmer}
          - {app: what, project: What, scheme: WhatIOS}
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate product project
        working-directory: ${{ matrix.app }}/ios
        run: xcodegen generate
      - name: Build product consumer
        working-directory: ${{ matrix.app }}/ios
        run: |
          xcodebuild -project '${{ matrix.project }}.xcodeproj' -scheme '${{ matrix.scheme }}' -destination 'generic/platform=iOS Simulator' -jobs 2 CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build

  ios-behavior:
    needs: core-tests
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {app: chickmark, project: HabitsByArvectumIOS, scheme: HabitsByArvectum, suite: HabitsByArvectumTests}
          - {app: what, project: What, scheme: WhatIOS, suite: WhatIOSTests}
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ${{ matrix.app }}/ios
        run: xcodegen generate
      - name: Run behavioral and persistence tests
        working-directory: ${{ matrix.app }}/ios
        timeout-minutes: 23
        run: |
          xcodebuild -project '${{ matrix.project }}.xcodeproj' -scheme '${{ matrix.scheme }}' -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0' -jobs 2 -parallel-testing-enabled NO "-only-testing:${{ matrix.suite }}" CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO test

  watchos-consumers:
    needs: core-tests
    runs-on: xcode-27
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {app: chickmark, project: HabitsByArvectumIOS, scheme: HabitsByArvectumWatch}
          - {app: what, project: What, scheme: WhatWatch}
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate watchOS project
        working-directory: ${{ matrix.app }}/ios
        run: xcodegen generate
      - name: Compile watchOS app and extensions
        working-directory: ${{ matrix.app }}/ios
        run: |
          xcodebuild -project '${{ matrix.project }}.xcodeproj' -scheme '${{ matrix.scheme }}' -destination 'generic/platform=watchOS Simulator' -jobs 2 CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build

  android-consumer:
    needs: core-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: photo-pdf-to-size/android
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 37
        run: |
          SDKMANAGER="$(find "${ANDROID_SDK_ROOT:-${ANDROID_HOME}}" -type f -path '*/cmdline-tools/*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-37.0' 'build-tools;36.0.0' --channel=3
      - uses: gradle/actions/setup-gradle@v4
      - name: Android unit tests, lint and APK
        run: ./gradlew test lintDebug assembleDebug
