name: Photo Size Android CI

on:
  push:
    branches:
      - '**'
    paths:
      - 'photo-pdf-to-size/android/**'
      - 'core/packages/**'
      - 'core/tools/sync_dependencies.py'
      - 'core/dependencies/android.versions.toml'
      - '.github/workflows/photo-size-android-ci.yml'
  pull_request:
    paths:
      - 'photo-pdf-to-size/android/**'
      - 'core/packages/**'
      - 'core/tools/sync_dependencies.py'
      - 'core/dependencies/android.versions.toml'
      - '.github/workflows/photo-size-android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: photo-size-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: photo-pdf-to-size/android

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 37
        run: |
          SDKMANAGER="$(find "${ANDROID_SDK_ROOT:-${ANDROID_HOME}}" -type f -path '*/cmdline-tools/*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-37.0' 'build-tools;36.0.0' --channel=3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify
        run: ./gradlew test lintDebug assembleDebug
