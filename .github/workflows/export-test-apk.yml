name: Export test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download prerelease APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.4.1-debug-6 --repo "${GITHUB_REPOSITORY}" --pattern "Foto-pod-razmer-0.4.1-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: foto-pod-razmer-0.4.1-debug
          path: Foto-pod-razmer-0.4.1-debug.apk
          if-no-files-found: error
