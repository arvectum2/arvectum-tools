name: Export test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download prerelease APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.2.0-debug-3 --repo "${GITHUB_REPOSITORY}" --pattern "Do-razmera-0.2.0-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: do-razmera-0.2.0-debug
          path: Do-razmera-0.2.0-debug.apk
          if-no-files-found: error
