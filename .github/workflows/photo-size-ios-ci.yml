name: Photo Size iOS CI

on:
  push:
    branches:
      - '**'
    paths:
      - 'photo-pdf-to-size/ios/**'
      - 'core/packages/**'
      - 'core/Package.swift'
      - 'core/dependencies/catalog.json'
      - 'core/tools/sync_dependencies.py'
      - 'core/tools/check_swift_lockfiles.py'
      - '.github/workflows/photo-size-ios-ci.yml'
  pull_request:
    paths:
      - 'photo-pdf-to-size/ios/**'
      - 'core/packages/**'
      - 'core/Package.swift'
      - 'core/dependencies/catalog.json'
      - 'core/tools/sync_dependencies.py'
      - 'core/tools/check_swift_lockfiles.py'
      - '.github/workflows/photo-size-ios-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: photo-size-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-for-testing:
    runs-on: xcode-27
    defaults:
      run:
        working-directory: photo-pdf-to-size/ios

    steps:
      - uses: actions/checkout@v7

      - name: Verify canonical Xcode 27
        run: |
          xcodebuild -version
          xcodebuild -version | grep -q '^Xcode 27\.'

      - name: Verify architecture, dependency catalog, and Core package
        working-directory: .
        run: |
          python3 core/tools/check_architecture.py
          python3 core/tools/sync_dependencies.py --check
          python3 core/tools/check_swift_lockfiles.py
          swift test --package-path core

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Build on the SAME concrete simulator used by the tests.
      # Previous generic build-for-testing compiled dual simulator architectures
      # and needlessly repeated the Xcode build in the next step.
      - name: A5 photo/PDF deterministic regression (unit + app-owned UI)
        timeout-minutes: 25
        run: |
          xcodebuild \
            -project PhotoPodRazmerIOS.xcodeproj \
            -scheme PhotoPodRazmer \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0' \
            -parallel-testing-enabled NO \
            -jobs 2 \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -only-testing:PhotoPodRazmerTests \
            -only-testing:PhotoPodRazmerUITests/LayoutRegressionUITests \
            -only-testing:PhotoPodRazmerUITests/WorkflowUITests/testPhotoCompressionAndBackNavigation \
            -only-testing:PhotoPodRazmerUITests/WorkflowUITests/testPixelAndDocumentModesWithPhotoFixture \
            -only-testing:PhotoPodRazmerUITests/WorkflowUITests/testPDFCompressionShowsExportActions \
            -only-testing:PhotoPodRazmerUITests/WorkflowUITests/testFilesImportEntryPointAvailable \
            test

      # Tests that depend on Apple's Files document browser/save sheet stay in
      # WorkflowUITests for local/physical acceptance, but are NOT the CI gate:
      # on fresh GitHub simulators Files uses locale- and boot-dependent labels,
      # causing false negatives and long accessibility snapshot timeouts.
      # See photo-pdf-to-size/docs/A5_CI_SYSTEM_FILES_TRIAGE_2026-10-15.md.
