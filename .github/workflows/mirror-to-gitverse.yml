name: Mirror to GitVerse

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: mirror-to-gitverse
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve configuration
        id: config
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          GITVERSE_REPOSITORY="${GH_REPOSITORY#*/}"
          echo "repository=${GITVERSE_REPOSITORY}" >> "$GITHUB_OUTPUT"
          if [ -z "$GITVERSE_TOKEN" ]; then
            echo "::error::GITVERSE_TOKEN is not configured"
            exit 1
          fi

      - name: Clone GitHub repository as mirror
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --mirror             "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}.git"             repository.git

      - name: Push branches and tags to GitVerse
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_REPOSITORY: ${{ steps.config.outputs.repository }}
        run: |
          set -euo pipefail
          cd repository.git
          git remote add gitverse             "https://arvectum:${GITVERSE_TOKEN}@gitverse.ru/arvectum/${GITVERSE_REPOSITORY}.git"
          git push --force --prune gitverse             'refs/heads/*:refs/heads/*'             'refs/tags/*:refs/tags/*'

      - name: Verify main SHA
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_REPOSITORY: ${{ steps.config.outputs.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          REMOTE_SHA="$(git ls-remote             "https://arvectum:${GITVERSE_TOKEN}@gitverse.ru/arvectum/${GITVERSE_REPOSITORY}.git"             refs/heads/main | awk '{print $1}')"
          if [ "$REMOTE_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::GitVerse main SHA mismatch: expected $EXPECTED_SHA, got $REMOTE_SHA"
            exit 1
          fi

      - name: Summary
        if: always()
        env:
          GITVERSE_REPOSITORY: ${{ steps.config.outputs.repository }}
        run: |
          echo "### GitVerse mirror" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: ${GITHUB_REPOSITORY}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: arvectum/${GITVERSE_REPOSITORY}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: ${GITHUB_EVENT_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
