name: Native roadmap criterion review
on:
  pull_request:
    paths:
      - 'core/docs/specs/001-portfolio-roadmap-traceability/**'
      - 'core/ROADMAP.md'
      - 'growth/ROADMAP.md'
      - 'growth/agent/ROADMAP.md'
      - 'chickmark/ROADMAP.md'
      - 'photo-pdf-to-size/ROADMAP.md'
      - 'pushkin/ROADMAP.md'
      - 'what/ROADMAP.md'
      - 'where/ROADMAP.md'
      - '.github/workflows/native-roadmap-review.yml'
permissions:
  contents: read
jobs:
  native-roadmap-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python core/docs/specs/001-portfolio-roadmap-traceability/checks/check_native_review.py
      - run: python -m unittest discover -s core/docs/specs/001-portfolio-roadmap-traceability/checks -p test_native_review.py
