name: PhotoPodRazmerIOS
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    DEVELOPMENT_TEAM: VML75VY94V
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"

targets:
  PhotoPodRazmer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PhotoPodRazmer
    info:
      path: PhotoPodRazmer/Info.plist
      properties:
        CFBundleDisplayName: "Фото под размер"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.arvectum.tools.tosize
        PRODUCT_NAME: PhotoPodRazmer
        PRODUCT_MODULE_NAME: PhotoPodRazmer
        MARKETING_VERSION: "0.4.2"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - PhotoPodRazmerTests

  PhotoPodRazmerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PhotoPodRazmerTests
    dependencies:
      - target: PhotoPodRazmer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.arvectum.tools.tosize.tests
        DEVELOPMENT_TEAM: VML75VY94V
        CODE_SIGN_STYLE: Automatic
