name: WhatMultimodalPhysicalQA
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

packages:
  ArvectumCore:
    path: ../../core

settings:
  base:
    DEVELOPMENT_TEAM: VML75VY94V
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "8"

targets:
  WhatIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../../core/packages/ArvectumPersistence/ArvectumJSONCodec.swift
      - path: ../../core/packages/ArvectumInterapp/ReviewNoteHandoff.swift
      - path: Shared
      - path: WhatIOS
        excludes:
          - Info.plist
          - en.lproj/InfoPlist.strings
          - ru.lproj/InfoPlist.strings
      - path: WhatPhysicalQA
        excludes:
          - Info.plist
    info:
      path: WhatPhysicalQA/Info.plist
      properties:
        CFBundleDisplayName: "Ухват 1.1 QA"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        NSSpeechRecognitionUsageDescription: "Transcribe your saved voice recordings on this iPhone using on-device speech recognition."
        NSMicrophoneUsageDescription: "Record private audio and video notes on this device. Media stays on-device."
        NSCameraUsageDescription: "Record private video notes using the camera. Videos stay on-device."
        CFBundleURLTypes:
          - CFBundleURLName: ru.arvectum.tools.what.multimodalqa.record
            CFBundleURLSchemes:
              - whatmultimodalqa
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # Apple's iPad multitasking requires every orientation for the iPad.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.arvectum.tools.what.multimodalqa
        PRODUCT_NAME: WhatIOS
        PRODUCT_MODULE_NAME: WhatIOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG REVIEW_HANDOFF_QA"
    dependencies:
      - package: ArvectumCore
        product: ArvectumCore
      # Production Watch companion and WidgetKit extensions are bundled
      # with the same release and use the public ru.arvectum.tools.what IDs.
    scheme:
      testTargets:
        - WhatIOSTests
        - WhatIOSUITests

  WhatIOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WhatIOSTests
    dependencies:
      - target: WhatIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.arvectum.tools.what.multimodalqa.tests
        GENERATE_INFOPLIST_FILE: YES

  WhatIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WhatIOSUITests
    dependencies:
      - target: WhatIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.arvectum.tools.what.multimodalqa.uitests
        GENERATE_INFOPLIST_FILE: YES


schemes:
  WhatIOS:
    build:
      targets:
        WhatIOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WhatIOSTests
        - WhatIOSUITests
