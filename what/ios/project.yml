name: What
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    DEVELOPMENT_TEAM: VML75VY94V
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "1"

targets:
  WhatIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../../core/packages/ArvectumPersistence/ArvectumJSONCodec.swift
      - path: ../../core/packages/ArvectumInterapp/ReviewNoteHandoff.swift
      - path: Shared
      - path: WhatIOS
    info:
      path: WhatIOS/Info.plist
      properties:
        CFBundleDisplayName: "Ухват P2a QA"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        NSSpeechRecognitionUsageDescription: "Transcribe your saved voice recordings on this iPhone using on-device speech recognition."
        NSMicrophoneUsageDescription: "Record private audio and video notes on this device. Media stays on-device."
        NSCameraUsageDescription: "Record private video notes using the camera. Videos stay on-device."
        CFBundleURLTypes:
          - CFBundleURLName: ru.arvectum.tools.what.p2aqa.record
            CFBundleURLSchemes:
              - whatp2aqa
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.arvectum.tools.what.p2aqa
        PRODUCT_NAME: WhatIOS
        PRODUCT_MODULE_NAME: WhatIOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      # Isolated integration QA: embed the *separate-ID* Watch app only in
      # P2a QA. Never replace the established ru.arvectum.tools.what.qa pair.
      - target: WhatWatch
      - target: WhatPhoneWidget
    scheme:
      testTargets:
        - WhatIOSTests
        - WhatIOSUITests

  WhatPhoneWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared/CaptureBrand.swift
      - path: WhatPhoneWidget
    info:
      path: WhatPhoneWidget/Info.plist
      properties:
        CFBundleDisplayName: "UhWhat? Record"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.arvectum.tools.what.p2aqa.widget
        PRODUCT_NAME: WhatPhoneWidget
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"

  WhatIOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WhatIOSTests
    dependencies:
      - target: WhatIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.arvectum.tools.what.p2aqa.tests
        GENERATE_INFOPLIST_FILE: YES

  WhatIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WhatIOSUITests
    dependencies:
      - target: WhatIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.arvectum.tools.what.p2aqa.uitests
        GENERATE_INFOPLIST_FILE: YES

  WhatWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ../../core/packages/ArvectumDiagnostics/ArvectumDiagnostics.swift
      - path: Shared
      - path: WhatWatch
    info:
      path: WhatWatch/Info.plist
      properties:
        CFBundleName: "UhWhat?"
        CFBundleDisplayName: "Ухват P2a QA"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: ru.arvectum.tools.what.p2aqa
        NSMicrophoneUsageDescription: "UhWhat? records the thought you speak so it can be saved locally and transferred to your iPhone."
        CFBundleURLTypes:
          - CFBundleURLName: ru.arvectum.tools.what.p2aqa.capture
            CFBundleURLSchemes:
              - whatp2aqa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.arvectum.tools.what.p2aqa.watch
        PRODUCT_NAME: WhatWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "4"
    dependencies:
      - target: WhatWatchComplication
    scheme: {}

  WhatWatchComplication:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Shared/CaptureBrand.swift
      - path: WhatWatchComplication
    info:
      path: WhatWatchComplication/Info.plist
      properties:
        CFBundleDisplayName: "Ухват P2a QA"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.arvectum.tools.what.p2aqa.watch.capturewidget
        PRODUCT_NAME: WhatWatchComplication
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "4"

schemes:
  WhatIOS:
    build:
      targets:
        WhatIOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WhatIOSTests

  WhatIOSUITests:
    build:
      targets:
        WhatIOSUITests: all
    test:
      config: Debug
      targets:
        - WhatIOSUITests

  WhatWatch:
    build:
      targets:
        WhatWatch: all
    run:
      config: Debug
