---
name: WhatReviewQA
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
settings:
  base:
    DEVELOPMENT_TEAM: VML75VY94V
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: 1.0.2
    CURRENT_PROJECT_VERSION: '101'
targets:
  WhatIOS:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
    - path: "../../core/packages/ArvectumPersistence/ArvectumJSONCodec.swift"
    - path: "../../core/packages/ArvectumInterapp/ReviewNoteHandoff.swift"
    - path: Shared
    - path: WhatIOS
      excludes:
      - Info.plist
      - en.lproj/InfoPlist.strings
      - ru.lproj/InfoPlist.strings
    - path: ReviewQA
      excludes:
      - What.Info.plist
    info:
      path: ReviewQA/What.Info.plist
      properties:
        CFBundleDisplayName: Ухват Review QA
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        NSSpeechRecognitionUsageDescription: Transcribe your saved voice recordings
          on this iPhone using on-device speech recognition.
        NSMicrophoneUsageDescription: Record private audio and video notes on this
          device. Media stays on-device.
        NSCameraUsageDescription: Record private video notes using the camera. Videos
          stay on-device.
        CFBundleURLTypes:
        - CFBundleURLName: ru.arvectum.tools.what.reviewqa.record
          CFBundleURLSchemes:
          - whatreviewqa
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.arvectum.tools.what.reviewqa
        PRODUCT_NAME: WhatIOS
        PRODUCT_MODULE_NAME: WhatIOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: false
        CURRENT_PROJECT_VERSION: '101'
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG REVIEW_HANDOFF_QA"
    dependencies: []
    scheme:
      testTargets:
      - WhatIOSUITests
  WhatIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: '17.0'
    sources:
    - path: WhatIOSUITests
    dependencies:
    - target: WhatIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.arvectum.tools.what.reviewqa.uitests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG REVIEW_HANDOFF_QA"
schemes:
  WhatIOS:
    build:
      targets:
        WhatIOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
      - WhatIOSUITests
  WhatIOSUITests:
    build:
      targets:
        WhatIOSUITests: all
    test:
      config: Debug
      targets:
      - WhatIOSUITests
