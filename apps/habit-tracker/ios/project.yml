    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.arvectum.tools.habits
        PRODUCT_NAME: HabitsByArvectum
        PRODUCT_MODULE_NAME: HabitsByArvectum
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "4"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: HabitsByArvectum/HabitsByArvectum.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SUPPORTS_MACCATALYST: NO
        OTHER_LDFLAGS: "$(inherited) -ObjC"
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    scheme:
      testTargets:
        - HabitsByArvectumTests
        - HabitsByArvectumUITests

  HabitsByArvectumWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: HabitsByArvectumWatch
      - path: Shared
    dependencies:
      - target: HabitsByArvectumWatchWidget
        embed: true
    info:
      path: HabitsByArvectumWatch/Info.plist
      properties:
        CFBundleDisplayName: "ChickMark"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: ru.arvectum.tools.habits
        WKRunsIndependentlyOfCompanionApp: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
            CFBundleIconFiles:
              - AppIcon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.arvectum.tools.habits.watch
        PRODUCT_NAME: HabitsByArvectumWatch
        PRODUCT_MODULE_NAME: HabitsByArvectumWatch
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: HabitsByArvectumWatch/HabitsByArvectumWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    scheme: {}

  HabitsByArvectumWatchWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: HabitsByArvectumWatchWidget
      - path: Shared/HabitSyncProtocol.swift
      - path: Shared/WatchComplicationBridge.swift
    info:
      path: HabitsByArvectumWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: "ChickMark"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.arvectum.tools.habits.watch.widget
        PRODUCT_NAME: HabitsByArvectumWatchWidget
        PRODUCT_MODULE_NAME: HabitsByArvectumWatchWidget
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: HabitsByArvectumWatchWidget/HabitsByArvectumWatchWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    scheme: {}

  HabitsByArvectumWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HabitsByArvectumWidget
      - path: HabitsByArvectum/ToggleHabitWidgetIntent.swift
      - path: Shared/HabitWidgetBridge.swift
      - path: Shared/HabitDeepLink.swift
    info:
      path: HabitsByArvectumWidget/Info.plist
      properties:
        CFBundleDisplayName: "ChickMark"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.arvectum.tools.habits.widget
        PRODUCT_NAME: HabitsByArvectumWidget
        PRODUCT_MODULE_NAME: HabitsByArvectumWidget
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: HabitsByArvectumWidget/HabitsByArvectumWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    scheme: {}

  HabitsByArvectumTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HabitsByArvectumTests
    dependencies:
      - target: HabitsByArvectum
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.arvectum.tools.habits.tests
        DEVELOPMENT_TEAM: VML75VY94V
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

