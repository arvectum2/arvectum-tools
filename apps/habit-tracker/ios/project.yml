name: HabitsByArvectumIOS
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    DEVELOPMENT_TEAM: VML75VY94V
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"

targets:
  HabitsByArvectum:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HabitsByArvectum
    info:
      path: HabitsByArvectum/Info.plist
      properties:
        CFBundleDisplayName: "Habits by Arvectum"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.arvectum.tools.habits
        PRODUCT_NAME: HabitsByArvectum
        PRODUCT_MODULE_NAME: HabitsByArvectum
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - HabitsByArvectumTests

  HabitsByArvectumTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HabitsByArvectumTests
    dependencies:
      - target: HabitsByArvectum
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.arvectum.tools.habits.tests
        DEVELOPMENT_TEAM: VML75VY94V
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
